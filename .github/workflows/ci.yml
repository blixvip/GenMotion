name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Zero runtime dependencies, so no npm install step.
      - name: Unit tests
        run: npm test
      - name: End-to-end API check (no keys, no network)
        run: npm run check
